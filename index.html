<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Internship Tracker</title><link rel="stylesheet" href="style.css"></head><body><header><p class="eyebrow">CAREER ORGANIZER</p><h1>Internship Tracker</h1><p>Keep every application in one place.</p></header><main><section class="stats"><article><span>Total applications</span><strong id="total">0</strong></article><article><span>Interviews</span><strong id="interviews">0</strong></article><article><span>Offers</span><strong id="offers">0</strong></article></section><div class="layout"><section class="panel"><h2 id="formTitle">Add application</h2><form id="form"><input type="hidden" id="id"><label>Company *<input id="company" required maxlength="100" placeholder="Company name"></label><label>Role *<input id="role" required maxlength="100" placeholder="Frontend Developer Intern"></label><label>Status<select id="status"><option>Applied</option><option>Interview</option><option>Offer</option><option>Rejected</option></select></label><label>Application date<input id="date" type="date"></label><label>Job link<input id="link" type="url" placeholder="https://..."></label><label>Notes<textarea id="notes" rows="3" maxlength="1000" placeholder="Contact or next steps"></textarea></label><div class="actions"><button class="primary" type="submit">Save application</button><button id="cancel" type="button" hidden>Cancel</button></div></form><p id="message" role="status"></p></section><section class="panel"><div class="listHead"><h2>Applications</h2><input id="search" placeholder="Search company or role"></div><div id="list"></div><p id="empty">No applications yet. Add one to get started.</p></section></div><footer>Demo app · Express REST API · JSON file storage</footer></main><script src="app.js"></script></body></html>
